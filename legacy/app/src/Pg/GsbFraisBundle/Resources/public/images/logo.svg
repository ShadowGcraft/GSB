<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="titreLogo">
<title id="titreLogo">Laboratoire Galaxy-Swiss Bourdin</title>
<!-- Logo GSB, version fête : un gros danseur ailé, chapeau d'anniversaire sur la tête,
     mange un taco et repousse pingouins et phoques à coups de lasers bleus.
     L'ancien logo, au capybara, est dans logo-capybara.svg. -->
<defs>
  <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9DB6DC"/><stop offset=".45" stop-color="#5B84BF"/><stop offset="1" stop-color="#8FAAD4"/>
  </linearGradient>
  <radialGradient id="peau" cx=".4" cy=".35" r=".75">
    <stop offset="0" stop-color="#FFD8B0"/><stop offset="1" stop-color="#E9A874"/>
  </radialGradient>
  <radialGradient id="tshirt" cx=".4" cy=".3" r=".8">
    <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#E7B42E"/>
  </radialGradient>
  <linearGradient id="aile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5E4F7"/>
  </linearGradient>
  <filter id="lueur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="flou"/>
    <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- un pingouin et un phoque, réutilisés deux fois chacun -->
  <g id="pingouin">
    <path d="M-8 22 l-6 5 h10 Z M8 22 l6 5 h-10 Z" fill="#F29A2E"/>
    <ellipse cx="0" cy="0" rx="16" ry="25" fill="#1D1F2B"/>
    <ellipse cx="0" cy="6" rx="10" ry="17" fill="#FFFFFF"/>
    <path d="M-15 -4 l-12 -14" stroke="#1D1F2B" stroke-width="7" stroke-linecap="round"/>
    <path d="M15 -4 l12 -14" stroke="#1D1F2B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-5" cy="-12" r="4" fill="#FFFFFF"/><circle cx="5" cy="-12" r="4" fill="#FFFFFF"/>
    <circle cx="-5" cy="-11" r="2" fill="#1D1F2B"/><circle cx="5" cy="-11" r="2" fill="#1D1F2B"/>
    <path d="M-4 -5 h8 l-4 7 Z" fill="#F29A2E"/>
  </g>
  <g id="phoque">
    <path d="M-34 18 C-30 4 -10 -6 8 -6 C24 -6 32 4 30 14 C20 22 -10 26 -34 18 Z" fill="#8C97A6" stroke="#4F5A69" stroke-width="2.5"/>
    <path d="M-34 18 l-12 -6 l2 12 Z" fill="#6E7988"/>
    <circle cx="18" cy="-12" r="14" fill="#9AA5B4" stroke="#4F5A69" stroke-width="2.5"/>
    <circle cx="14" cy="-16" r="3.2" fill="#1D1F2B"/><circle cx="23" cy="-16" r="3.2" fill="#1D1F2B"/>
    <circle cx="13" cy="-17" r="1" fill="#FFFFFF"/><circle cx="22" cy="-17" r="1" fill="#FFFFFF"/>
    <ellipse cx="19" cy="-8" rx="3.5" ry="2.5" fill="#2A2F3A"/>
    <circle cx="19" cy="-2" r="2.6" fill="#2A2F3A"/>
    <path d="M24 -7 l12 -2 M24 -5 l12 2 M14 -7 l-12 -2 M14 -5 l-12 2" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
    <path d="M-4 16 l-4 12 l10 -8 Z" fill="#6E7988"/>
  </g>
  <!-- étincelle d'impact -->
  <path id="impact" d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#BFF1FF"/>
</defs>

<!-- ellipse de fond, comme le logo d'origine -->
<ellipse cx="300" cy="200" rx="292" ry="188" fill="#3F5F8F"/>
<ellipse cx="300" cy="196" rx="286" ry="182" fill="url(#fond)"/>
<ellipse cx="300" cy="120" rx="230" ry="80" fill="#FFFFFF" opacity=".10"/>

<!-- pingouins à gauche, phoques à droite -->
<use href="#pingouin" transform="translate(110 282)"/>
<use href="#pingouin" transform="translate(160 316) scale(.85)"/>
<use href="#phoque" transform="translate(500 290) scale(-1 1)"/>
<use href="#phoque" transform="translate(448 330) scale(-.85 .85)"/>

<!-- ailes, derrière le danseur -->
<g stroke="#8AA6CF" stroke-width="2.5" stroke-linejoin="round" fill="url(#aile)">
  <path id="aileGauche" d="M262 168 C228 124 178 92 116 96 C136 108 146 116 148 124 C128 124 114 132 106 146 C128 146 142 150 150 158 C134 164 126 174 122 190 C146 182 166 180 184 184 C198 180 230 178 258 194 Z"/>
  <use href="#aileGauche" transform="translate(600 0) scale(-1 1)"/>
</g>
<g stroke="#8AA6CF" stroke-width="1.6" fill="none" stroke-linecap="round">
  <path d="M232 160 C200 140 170 128 140 124 M226 172 C200 160 176 154 150 158 M222 182 C200 178 180 178 160 184"/>
  <path d="M368 160 C400 140 430 128 460 124 M374 172 C400 160 424 154 450 158 M378 182 C400 178 420 178 440 184"/>
</g>

<!-- jambes en pas de danse : l'une levée sur le côté, l'autre en appui -->
<g stroke-linecap="round" fill="none">
  <path d="M262 282 C246 300 228 310 206 312" stroke="#5A3A22" stroke-width="30"/>
  <path d="M262 282 C246 300 228 310 206 312" stroke="url(#peau)" stroke-width="24"/>
  <path d="M332 288 C338 312 340 330 342 346" stroke="#5A3A22" stroke-width="30"/>
  <path d="M332 288 C338 312 340 330 342 346" stroke="url(#peau)" stroke-width="24"/>
</g>
<ellipse cx="196" cy="314" rx="20" ry="11" fill="#D6453A" stroke="#5A3A22" stroke-width="3" transform="rotate(-15 196 314)"/>
<ellipse cx="352" cy="352" rx="22" ry="11" fill="#D6453A" stroke="#5A3A22" stroke-width="3"/>

<!-- corps : gros ventre rond, t-shirt GSB, short -->
<path d="M228 262 Q300 318 372 262 L376 292 Q300 324 224 292 Z" fill="#3E5BA9" stroke="#5A3A22" stroke-width="3"/>
<ellipse cx="300" cy="212" rx="84" ry="84" fill="url(#tshirt)" stroke="#5A3A22" stroke-width="3"/>
<ellipse cx="300" cy="286" rx="30" ry="9" fill="url(#peau)" stroke="#5A3A22" stroke-width="2.5"/>
<circle cx="300" cy="287" r="2.5" fill="#B9774A"/>
<path d="M250 150 Q300 172 350 150" stroke="#C99624" stroke-width="3" fill="none"/>
<text x="300" y="232" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif"
      font-weight="900" font-style="italic" font-size="48" fill="#FFFFFF" stroke="#2D4E7E" stroke-width="5" paint-order="stroke">GSB</text>

<!-- bras : un levé bien haut, l'autre porte le taco à la bouche -->
<g stroke-linecap="round" fill="none">
  <path d="M232 172 C206 146 200 112 208 78" stroke="#5A3A22" stroke-width="26"/>
  <path d="M232 172 C206 146 200 112 208 78" stroke="url(#peau)" stroke-width="20"/>
  <path d="M366 176 C392 168 390 142 358 134" stroke="#5A3A22" stroke-width="26"/>
  <path d="M366 176 C392 168 390 142 358 134" stroke="url(#peau)" stroke-width="20"/>
</g>
<circle cx="209" cy="72" r="13" fill="url(#peau)" stroke="#5A3A22" stroke-width="3"/>

<!-- tête -->
<circle cx="300" cy="108" r="42" fill="url(#peau)" stroke="#5A3A22" stroke-width="3"/>
<ellipse cx="276" cy="122" rx="9" ry="6" fill="#F28C8C" opacity=".6"/>
<ellipse cx="326" cy="124" rx="7" ry="5" fill="#F28C8C" opacity=".6"/>
<circle cx="287" cy="104" r="8" fill="#FFFFFF" stroke="#5A3A22" stroke-width="2"/>
<circle cx="313" cy="104" r="8" fill="#FFFFFF" stroke="#5A3A22" stroke-width="2"/>
<circle cx="287" cy="105" r="4" fill="#1C6FD1"/>
<circle cx="313" cy="105" r="4" fill="#1C6FD1"/>
<path d="M278 92 q9 -6 17 0 M305 92 q9 -6 17 0" stroke="#5A3A22" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- bouche grande ouverte, prête à croquer -->
<ellipse cx="316" cy="130" rx="11" ry="9" fill="#7A2323" stroke="#5A3A22" stroke-width="2.5"/>
<path d="M309 128 h14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

<!-- chapeau d'anniversaire, de travers -->
<g transform="rotate(-14 300 70)">
  <path d="M272 74 L300 12 L328 74 Z" fill="#E4407B" stroke="#5A3A22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M285 42 L315 42 M280 56 L320 56 M292 28 L308 28" stroke="#FFE27A" stroke-width="5"/>
  <circle cx="300" cy="12" r="8" fill="#FFE27A" stroke="#5A3A22" stroke-width="2.5"/>
  <path d="M272 74 Q300 82 328 74" stroke="#5A3A22" stroke-width="3" fill="none"/>
</g>

<!-- taco, tenu contre la bouche -->
<g transform="translate(330 104) rotate(-24)">
  <!-- coquille en U, garniture qui déborde par le haut -->
  <path d="M6 14 q6 -10 12 -2 q6 -10 12 -2 q6 -10 12 -2 q5 -8 10 0" stroke="#3E9E3A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 18 Q28 8 50 18" stroke="#8A4A24" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="17" cy="11" r="4" fill="#E0322E"/><circle cx="33" cy="9" r="4" fill="#E0322E"/><circle cx="46" cy="12" r="3.5" fill="#E0322E"/>
  <path d="M2 16 A27 24 0 0 0 58 16 Z" fill="#F4C04E" stroke="#5A3A22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M12 24 q4 4 8 0 M26 28 q4 4 8 0 M40 24 q4 4 8 0" stroke="#D69A2C" stroke-width="2" fill="none"/>
</g>
<circle cx="335" cy="152" r="2.5" fill="#F4C04E"/><circle cx="344" cy="160" r="2" fill="#F4C04E"/><circle cx="328" cy="162" r="2" fill="#3E9E3A"/>

<!-- lasers bleus : halo flou, puis cœur blanc -->
<g filter="url(#lueur)" stroke-linecap="round">
  <g stroke="#3FA9FF" stroke-width="7" opacity=".9">
    <path d="M287 105 L114 268"/><path d="M287 105 L162 302"/>
    <path d="M313 105 L490 272"/><path d="M313 105 L440 312"/>
  </g>
  <g stroke="#E6F7FF" stroke-width="2.2">
    <path d="M287 105 L114 268"/><path d="M287 105 L162 302"/>
    <path d="M313 105 L490 272"/><path d="M313 105 L440 312"/>
  </g>
  <use href="#impact" transform="translate(114 268)"/>
  <use href="#impact" transform="translate(162 302) scale(.8)"/>
  <use href="#impact" transform="translate(490 272)"/>
  <use href="#impact" transform="translate(440 312) scale(.8)"/>
</g>

<!-- ça danse : traits de mouvement et notes de musique -->
<g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85">
  <path d="M178 90 q-10 -14 -4 -30 M186 104 q-16 -12 -16 -30"/>
</g>
<g fill="#FFFFFF" font-family="'Segoe UI Symbol', 'Arial Unicode MS', sans-serif" font-size="34" font-weight="700">
  <text x="392" y="70">♪</text>
  <text x="430" y="104" font-size="26">♫</text>
  <text x="150" y="60" font-size="26">♪</text>
</g>
</svg>
