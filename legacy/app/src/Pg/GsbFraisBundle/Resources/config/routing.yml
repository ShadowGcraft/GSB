pg_gsb_frais_home:
    pattern:  /accueil
    defaults: { _controller: PgGsbFraisBundle:Home:index } 
pg_gsb_frais_validerconnexion:
    pattern:  /validerconnexion
    defaults: { _controller: PgGsbFraisBundle:Home:validerconnexion } 
pg_gsb_frais_deconnexion:
    pattern:  /deconnexion
    defaults: { _controller: PgGsbFraisBundle:Home:deconnexion } 
pg_gsb_frais_listefrais:
    pattern:  /listefrais
    defaults: { _controller: PgGsbFraisBundle:ListeFrais:index } 
pg_gsb_frais_saisirfrais:
    pattern:  /saisirfrais
    defaults: { _controller: PgGsbFraisBundle:SaisirFrais:index } 
pg_gsb_frais_validerfraishorsforfais:
    pattern:  /validerfraishorsforfait
    defaults: { _controller: PgGsbFraisBundle:SaisirFrais:validerfraishorsforfait }
pg_gsb_frais_supprimerfraishorsforfait:
    pattern:  /supprimerfraishorsforfait/{id}
    defaults: { _controller: PgGsbFraisBundle:SaisirFrais:supprimerfraishorsforfait }

# --- Ajouts 2026 -------------------------------------------------------------
pg_gsb_frais_ajouterfraisforfait:
    pattern:  /ajouterfraisforfait
    defaults: { _controller: PgGsbFraisBundle:SaisirFrais:ajouterfraisforfait }
    methods:  [POST]
pg_gsb_frais_justificatif_voir:
    pattern:  /justificatif/{id}
    defaults: { _controller: PgGsbFraisBundle:Justificatif:voir }
    requirements: { id: '\d+' }
pg_gsb_frais_justificatif_ajouter:
    pattern:  /fraishorsforfait/{id}/justificatifs
    defaults: { _controller: PgGsbFraisBundle:Justificatif:ajouter }
    requirements: { id: '\d+' }
    methods:  [POST]
pg_gsb_frais_justificatif_supprimer:
    pattern:  /justificatif/{id}/supprimer
    defaults: { _controller: PgGsbFraisBundle:Justificatif:supprimer }
    requirements: { id: '\d+' }
    methods:  [POST]

pg_gsb_frais_admin_fiches:
    pattern:  /admin/fiches
    defaults: { _controller: PgGsbFraisBundle:Admin:fiches }
pg_gsb_frais_admin_fiche:
    pattern:  /admin/fiche/{idVisiteur}/{mois}
    defaults: { _controller: PgGsbFraisBundle:Admin:fiche }
    requirements: { mois: '\d{6}' }
pg_gsb_frais_admin_valider:
    pattern:  /admin/fiche/{idVisiteur}/{mois}/valider
    defaults: { _controller: PgGsbFraisBundle:Admin:validerFiche }
    requirements: { mois: '\d{6}' }
    methods:  [POST]
pg_gsb_frais_admin_rembourser:
    pattern:  /admin/fiche/{idVisiteur}/{mois}/rembourser
    defaults: { _controller: PgGsbFraisBundle:Admin:rembourserFiche }
    requirements: { mois: '\d{6}' }
    methods:  [POST]
pg_gsb_frais_admin_refuserfrais:
    pattern:  /admin/fraishorsforfait/{id}/refuser
    defaults: { _controller: PgGsbFraisBundle:Admin:refuserFrais }
    requirements: { id: '\d+' }
    methods:  [POST]

